<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HUD Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>HUD Prototype</h2>

    <div class="field">
        <label for="inputX">X</label>
        <input type="number" id="inputX" value="0">
    </div>
    <div class="field">
        <label for="inputY">Y</label>
        <input type="number" id="inputY" value="0">
    </div>

    <button onclick="sendCommand(1)">Button 1</button>
    <button onclick="sendCommand(2)">Button 2</button>
    <button onclick="sendCommand(3)">Button 3</button>
    <div id="status">Waiting for HUD connection...</div>

    <script src="script.js"></script>
</body>
</html>
